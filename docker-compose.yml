services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: altotech_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-building_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d building_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  seed:
    build: .
    container_name: altotech_seed
    command: python db/seed.py
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-building_db}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Bangkok}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    container_name: altotech_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-building_db}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai/v1}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Bangkok}
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: .
    container_name: altotech_frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./:/app
    environment:
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  timescale_data:
